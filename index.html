<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spese">
    <meta name="theme-color" content="#007AFF">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <title>Le mie spese</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/spese.css">
    <link rel="stylesheet" href="css/stats.css">
    <script type="module" src="js/main.js"></script>
    <script>
        // Rete di sicurezza: se l'app non riesce a partire (per esempio con un
        // aggiornamento arrivato solo in parte), riscarica i file freschi una volta.
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (window.__appReady) return;
                try {
                    if (sessionStorage.getItem('bootRetry')) return;
                    sessionStorage.setItem('bootRetry', '1');
                } catch (e) { return; }
                var urls = [location.href];
                (performance.getEntriesByType ? performance.getEntriesByType('resource') : []).forEach(function (e) {
                    if (e.name.indexOf(location.origin) === 0) urls.push(e.name);
                });
                Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }))
                    .then(function () { location.reload(); });
            }, 1000);
        });
    </script>
</head>
<body>
    <!--
        Scheletro dell'app. Ogni <section> viene riempita dal suo modulo in js/features/.
        Per aggiungere una schermata: una <section> qui, un bottone nella tab bar,
        un modulo che la riempie, una riga in js/main.js.
    -->
    <div class="app">
        <header class="header"><h1 id="pageTitle">Spese</h1></header>

        <section id="tab-spese" class="tab-content active"></section>
        <section id="tab-stats" class="tab-content"></section>
        <section id="tab-settings" class="tab-content"></section>

        <nav class="tab-bar">
            <button class="tab-btn active" data-tab="spese" data-title="Spese">
                <span class="tab-icon">🧾</span><span>Spese</span>
            </button>
            <button class="tab-btn" data-tab="stats" data-title="Statistiche">
                <span class="tab-icon">📊</span><span>Statistiche</span>
            </button>
            <button class="tab-btn" data-tab="settings" data-title="Impostazioni">
                <span class="tab-icon">⚙️</span><span>Impostazioni</span>
            </button>
        </nav>
    </div>
</body>
</html>
